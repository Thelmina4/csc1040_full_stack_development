<!DOCTYPE html>
<html>
<head>
    <title>Building using div</title>
</head>
<body>
    <div id="hidden">
        <p>
            enter words here that will get hidden
        </p>
    </div>
    <button id="hide">HIDE</button>
    

    <script>
    // 1. Clicking the button hides the <div>
    //  and changes the button label to Show  - need a boolean to toggle?
    // let allows me to hcange the value of istoggle
    let istoggle = true
    // 2. Clicking again shows the <div> and reverts the button label to Hide
    const hidden = document.querySelector("#hidden");
    const button = document.querySelector("#hide");
    button.addEventListener("click", function() {
        if (istoggle) {
            hidden.style.display = "none";
            button.innerHTML = "Show"
            istoggle = false;
        } else {
            hidden.style.display = "";
            button.innerHTML = "Hide"
            istoggle = true;
        }
    })

    // OR
    button.addEventListener("click", function() {
        // Check the current display state directly from the element
        if (hidden.style.display === "") {
            // If it's currently visible, hide it
            hidden.style.display = "none";
            button.innerHTML = "Show";
        } else {
            // If it's currently "none", show it
            hidden.style.display = "";
            button.innerHTML = "Hide";
        }
    });
    </script>
</body>


</html>
