<!-- 1. Display a "Loading questions..." message while the request is in progress -->
<!-- 2. Once the data arrives, replace the loading message with the rendered questions -->
<!-- 3. For each question, display:
            The question text
            All four answers (correct + three incorrect) as an unordered list 
            — shuffle them so the correct answer is not always in the same position -->
<!-- 4. If the fetch fails for any reason, replace the loading message with: "Could not load questions. Please try again later." -->

<!-- PART 2  -->
<!-- Render each answer as a <button> instead of a plain list item -->
   <!-- When an answer button is clicked:
If the answer matches correct_answer, insert a "Correct!"
 message below the question
If it does not match, insert "Incorrect. The answer was [correct_answer]." below the question -->
<!DOCTYPE html>
<html>

<head>
    <title>Open Trivia Database?</title>
    <!-- Use the Open Trivia Database API to load and display 5 trivia questions. -->
</head>

<body>
    <div>
        <p id="load">Loading questions...</p>
    </div>
    <!-- Fetch from this URL when the page loads:
            https://opentdb.com/api.php?amount=5&type=multiple -->
    <script>
        let url = "https://opentdb.com/api.php?amount=5&type=multiple"

        fetch(url)
            .then(response => response.json())
            .then(data => {
                // render data.results here
                // 2. Once the data arrives, replace the loading message with the rendered questions

                const load = document.getElementById("load");
                load.innerHTML = "";

                data.results.forEach(q => {
                    let win = q.correct_answer;

                    let all = [...q.incorrect_answers, q.correct_answer];
                    all.sort(() => Math.random() - 0.5);

                    let html = "<p>" + q.question + "</p>";

                    html += "<ul>"

                    all.forEach(a => {
                        html += "<button>" + a + "</button><br>";
                    });

                    html += "</ul>";
                    load.innerHTML += html;
                });
            })
            .catch(error => {
                // display error message here
                // "Could not load questions. Please try again later."
                document.getElementById("load").innerHTML =
                    "Could not load questions. Please try again later.";
            });
    </script>
</body>

</html>
