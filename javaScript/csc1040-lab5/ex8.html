<!-- You will fetch a user profile and their posts
  from a placeholder API and display them together on the page.

Use these two endpoints (replace 1 with any user ID from 1–10):

https://jsonplaceholder.typicode.com/users/1
https://jsonplaceholder.typicode.com/posts?userId=1 -->

<!DOCTYPE html>
<html>
    <head>
        <title>Fetching from Multiple Endpoints</title>
    </head>
    <body>
        <!-- placeholder for divs etc here -->
        <div>
            <p id="load">Loading...

            </p>
        </div>
        <script>
            let usr = "https://jsonplaceholder.typicode.com/users/"
            let post = "https://jsonplaceholder.typicode.com/posts?userId="
            async function loadProfile() {
                try {
                    // pick  a random usr profile
                    let rand = Math.floor(Math.random() * 10);
                    // test that rand works
                    console.log(rand);

                    usr += rand;
                    post+= rand;

                    console.log(usr);
                    console.log(post);

                    // const usrRes = await fetch(usr);
                    // const postRes = await fetch(post);
                    // or 
                    const [usrRes, postRes] = await Promise.all([
                        fetch(usr),
                        fetch(post)
                    ]);
                    // This is faster than two sequential await fetch(...)
                    //  calls because both requests run at the same time.

                    // data
                    const dataUsr = await usrRes.json();
                    const dataPost = await postRes.json();

                    const load = document.getElementById("load");
                    load.innerHTML = "";

                    // create the space for the output
                    // output dataUsr.name, dataUsr.email
                    const usrName = document.createElement("h1");
                    usrName.innerHTML = dataUsr.name;

                    const usrEmail = document.createElement("h2");
                    usrEmail.innerHTML = dataUsr.email;
                    load.append(usrName);
                    load.append(usrEmail);

                    // create the space for the posts
                    let html = "<ul>";
                    // html += "<li>" + "thelma" + "</li>" + "</ul>";
                    dataPost.forEach(post => {
                        html += "<li>" + post.title + "</li>";
                    })
                    html += "</ul>";
                    load.innerHTML += html;                   

                } catch (error) {
                    document.getElementById("load").innerHTML = 
                        "Could not load profile. Please try again later.";
                    console.error(error);
                } 
            }
            loadProfile()
        </script>
    </body>
</html>
