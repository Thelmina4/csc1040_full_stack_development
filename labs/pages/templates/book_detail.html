<!-- pages/templates/book_detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{{ book.title }}</title>
</head>
<body>
    <h1>{{ book.title }}</h1>

    <p><strong>Year Published:</strong> {{ book.year_published }}</p>
    <p><strong>Author:</strong> <a href="{% url 'author_detail' book.author.id %}">{{ book.author.name }}</a></p>
    <a href="{% url 'book_list' %}">← Back to all books</a>
    <br>
    {% comment %} hard codedin the next line {% endcomment %}
    <a href="/books/">← Back to all books</a>
</body>
</html>
